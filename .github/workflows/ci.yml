name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt -r requirements-ml.txt
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Sample data is reproducible
        run: python -m datasentinel.samples.generator --check
      - name: Tests
        run: python -m pytest -p no:logging
      - name: Dependency audit
        if: matrix.python == '3.12'
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt -r requirements-ml.txt -r requirements-postgres.txt

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          E2E_PYTHON: python
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t datasentinel:ci .
      - name: Smoke test (readiness, demo workspace, demo-mode write protection)
        run: |
          docker run -d --name ds -p 8000:8000 \
            -e DATASENTINEL_LOAD_SAMPLES_ON_STARTUP=true -e DATASENTINEL_DEMO_MODE=true datasentinel:ci
          for i in $(seq 1 40); do curl -fsS http://localhost:8000/api/v1/ready && break; sleep 3; done
          curl -fsS http://localhost:8000/api/v1/dashboard | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['dataset_count']==5, d"
          curl -fsS http://localhost:8000/ | grep -q '<div id="root">'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -F file=@backend/datasentinel/samples/data/customers.csv http://localhost:8000/api/v1/datasets/import)
          test "$code" = "403"
      - if: failure()
        run: docker logs ds
