# Used only for developer CLI commands such as:
#   .\.venv\Scripts\python.exe -m alembic revision --autogenerate -m "describe change"
# The application applies migrations itself on startup (DATASENTINEL_AUTO_MIGRATE=true).
[alembic]
script_location = datasentinel/migrations
sqlalchemy.url = sqlite:///var/datasentinel.db
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
