[project]
name = "datasentinel"
version = "0.1.0"
description = "Explainable data observability: quality rules, schema drift, statistical anomalies and downstream impact."
requires-python = ">=3.12"
license = "MIT"
readme = "../README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "ml: requires the optional scikit-learn dependency",
  "slow: longer-running tests",
]
filterwarnings = [
  "error::pytest.PytestUnraisableExceptionWarning",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["datasentinel/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "S101",   # assert is fine in tests
  "B008",   # FastAPI Depends() in defaults is idiomatic
  "RUF012", # mutable class attributes in pydantic/sqlalchemy models
  "E501",   # line length is handled by ruff format; long literal strings are allowed
  "RUF005", # list concatenation is clearer than unpacking in the report builder
  "SIM108", # if/else blocks are often clearer than ternaries
  "RUF001", "RUF002", "RUF003", # typographic unicode in prose is intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"benchmarks/**" = ["S311"]
"datasentinel/faults.py" = ["S311"]
"datasentinel/samples/generator.py" = ["S311"]
